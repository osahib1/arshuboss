
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Chat</title>
<script type="module" src="auth-guard.js"></script>
<style>
 
/* =========================
   GLOBAL
========================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  background: #0b141a url("image/chatsbackground.jpg") center / cover no-repeat fixed;
  color: #e9edef;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

button, input {
  font: inherit;
}

/* MAIN APP */

.chat-app {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  overflow: hidden;
  background: rgba(11, 20, 26, 0.25);
}

/* SIDEBAR */

.sidebar {
  width: 350px;
  min-width: 280px;
  background: #111b21;
  border-right: 1px solid #26343b;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  min-height: 65px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #202c33;
}

.logo {
  font-size: 21px;
  font-weight: bold;
  color: #25d366;
}

.back {
  color: #e9edef;
  text-decoration: none;
  font-size: 14px;
}

.search-box {
  padding: 13px;
}

.search-box input {
  width: 100%;
  padding: 13px 15px;
  background: #202c33;
  color: white;
  border: 1px solid transparent;
  outline: none;
  border-radius: 10px;
  font-size: 14px;
}

.search-box input:focus {
  border-color: #25d366;
}

.search-box button {
  width: 100%;
  margin-top: 9px;
  padding: 12px;
  background: #25d366;
  color: #071b12;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

.recent-heading {
  padding: 12px 15px 8px;
  color: #25d366;
  font-size: 13px;
  font-weight: bold;
}

#recentChats {
  overflow-y: auto;
  min-height: 0;
  border-bottom: 1px solid #26343b;
}

.recent-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 0;
  border-bottom: 1px solid #26343b;
  background: transparent;
  color: white;
  text-align: left;
  cursor: pointer;
}

.recent-item:hover {
  background: #202c33;
}

.recent-avatar {
  width: 46px;
  height: 46px;
  min-width: 46px;
  border-radius: 50%;
  overflow: hidden;
  background: #374045;
  display: flex;
  align-items: center;
  justify-content: center;
}

.recent-avatar img,
.search-avatar img,
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.recent-info {
  flex: 1;
  min-width: 0;
}

.recent-name {
  font-size: 14px;
  margin-bottom: 5px;
  font-weight: 500;
}

.recent-preview {
  font-size: 12px;
  color: #aebac1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.recent-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.recent-time {
  font-size: 10px;
  color: #8696a0;
}

.unread-badge {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 20px;
  background: #25d366;
  color: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: bold;
}

#recentEmpty {
  padding: 14px 15px;
  color: #8696a0;
  font-size: 12px;
}

/* SEARCH RESULTS */

#result {
  padding: 10px;
  overflow: auto;
}

#result button {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px;
  margin-bottom: 8px;
  text-align: left;
  background: #202c33;
  color: white;
  border: 1px solid #2b3a42;
  border-radius: 10px;
  cursor: pointer;
}

#result button:hover {
  background: #2a3942;
}

.search-avatar {
  width: 43px;
  height: 43px;
  min-width: 43px;
  border-radius: 50%;
  overflow: hidden;
  background: #374045;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CHAT MAIN */

.chat-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: rgba(11, 20, 26, 0.35);
  overflow: hidden;
}

/* CHAT HEADER */

.chat-header {
  min-height: 70px;
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #202c33;
  border-bottom: 1px solid #2a3942;
  flex-shrink: 0;
  z-index: 2;
}

.avatar {
  width: 44px;
  height: 44px;
  min-width: 44px;
  border-radius: 50%;
  background: #374045;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.header-info {
  flex: 1;
  min-width: 0;
}

.header-info h3 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  color: #e9edef;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.header-info p {
  margin: 5px 0 0;
  color: #aebac1;
  font-size: 12px;
}

/* MESSAGES */

#messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 22px 5%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: transparent;
  scroll-behavior: smooth;
  overscroll-behavior: contain;
}

/* MESSAGE ROW */

.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  width: 100%;
  margin: 1px 0;
}

.msg-row.mine {
  justify-content: flex-end;
}

.msg-row.theirs {
  justify-content: flex-start;
}

.msg-select {
  width: 18px;
  height: 18px;
  accent-color: #25d366;
  flex-shrink: 0;
}

/* MESSAGE BUBBLES */

.msg {
  position: relative;
  display: flex;
  flex-direction: column;
  width: fit-content;
  max-width: min(75%, 500px);
  padding: 7px 9px 5px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.4;
  font-weight: 400;
  overflow-wrap: anywhere;
  word-break: break-word;
  box-shadow: none;
}

.my-msg {
  background: #075e4f;
  color: #e9edef;
  border-top-right-radius: 2px;
}

.other-msg {
  background: #202c33;
  color: #e9edef;
  border-top-left-radius: 2px;
}

.message-content {
  display: block;
  width: 100%;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-weight: 400;
}

.msg p {
  margin: 0;
  padding: 0;
  font-weight: 400;
}

/* TIME + TICKS */

.message-footer {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  align-self: flex-end;
  gap: 4px;
  width: max-content;
  max-width: 100%;
  margin-top: 4px;
  min-height: 12px;
  line-height: 1;
  white-space: nowrap;
}

.message-time {
  color: rgba(233, 237, 239, 0.68);
  font-size: 10px;
  font-weight: 400;
  white-space: nowrap;
}

.message-ticks {
  display: inline-block;
  color: #b5c8c2;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: -1px;
  white-space: nowrap;
  margin: 0;
  padding: 0;
  line-height: 1;
}

.message-ticks.seen {
  color: #53bdeb;
}

/* REPLY QUOTE */

.reply-quote {
  display: block;
  width: 100%;
  background: rgba(0, 0, 0, 0.18);
  border-left: 3px solid #53bdeb;
  border-radius: 5px;
  padding: 6px 8px;
  margin-bottom: 6px;
  overflow: hidden;
}

.reply-quote strong {
  display: block;
  color: #53bdeb;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 3px;
}

.reply-quote span {
  display: block;
  color: #d5e0e3;
  font-size: 12px;
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* REPLY PREVIEW */

#replyPreview {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 15px;
  background: #172229;
  border-left: 4px solid #25d366;
  border-top: 1px solid #26343b;
  flex-shrink: 0;
}

#replyPreview[hidden] {
  display: none !important;
}

#replyPreview > div {
  min-width: 0;
  flex: 1;
}

#replyPreview strong {
  color: #25d366;
  font-size: 12px;
}

#replyPreview p {
  margin: 5px 0 0;
  color: #c6d1d5;
  font-size: 13px;
  overflow-wrap: anywhere;
}

#cancelReply {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border: none;
  border-radius: 50%;
  background: #26343b;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

/* PHOTOS */

.chat-photo {
  display: block;
  width: 220px;
  max-width: 100%;
  max-height: 280px;
  object-fit: cover;
  border-radius: 7px;
  margin-bottom: 3px;
  cursor: pointer;
}

/* TYPING */

#typingIndicator {
  display: none;
  color: #25d366;
  font-size: 12px;
  margin: 4px 0 0;
}

/* INPUT AREA */

.input-area {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: #202c33;
  border-top: 1px solid #26343b;
  flex-shrink: 0;
}

#photoBtn {
  width: 45px;
  height: 45px;
  min-width: 45px;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: #c7d1d6;
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

#messageInput {
  flex: 1;
  min-width: 0;
  height: 48px;
  padding: 0 18px;
  border: 1px solid transparent;
  outline: none;
  border-radius: 25px;
  background: #2a3942;
  color: white;
  font-size: 15px;
}

#messageInput:focus {
  border-color: #25d366;
}

#messageInput::placeholder {
  color: #aebac1;
}

#send {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border: none;
  border-radius: 50%;
  background: #25d366;
  color: #071b12;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

#send:active {
  transform: scale(0.94);
}

/* STATUS */

#status {
  padding: 5px 12px;
  color: #ffb86b;
  font-size: 12px;
  background: #202c33;
  margin: 0;
  flex-shrink: 0;
}

/* MOBILE BACK */

#mobileBack {
  width: 40px;
  height: 40px;
  padding: 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  line-height: 1;
  border: none;
  background: transparent;
  color: white;
  cursor: pointer;
  flex-shrink: 0;
}

/* SCROLLBARS */

#messages::-webkit-scrollbar,
#recentChats::-webkit-scrollbar,
#result::-webkit-scrollbar {
  width: 5px;
}

#messages::-webkit-scrollbar-thumb,
#recentChats::-webkit-scrollbar-thumb,
#result::-webkit-scrollbar-thumb {
  background: #40515a;
  border-radius: 10px;
}

/* TABLET */

@media (max-width: 900px) {
  .sidebar {
    width: 300px;
    min-width: 260px;
  }

  #messages {
    padding: 18px 3%;
  }

  .msg {
    max-width: 80%;
  }
}

/* MOBILE */

@media (max-width: 650px) {
  body {
    background: #0b141a;
  }

  .chat-app {
    height: 100vh;
    height: 100dvh;
    height: var(--chat-height, 100dvh);
    min-height: 0;
  }

  .sidebar {
    width: 100%;
    min-width: 0;
    border-right: none;
  }

  .chat-main {
    display: none;
    width: 100%;
    min-height: 0;
  }

  body.chat-open .sidebar {
    display: none;
  }

  body.chat-open .chat-main {
    display: flex;
  }

  body.chat-open #mobileBack {
    display: flex;
  }

  .chat-header {
    min-height: 62px;
    padding: 8px 10px;
    gap: 9px;
  }

  .avatar {
    width: 40px;
    height: 40px;
    min-width: 40px;
  }

  .header-info h3 {
    font-size: 15px;
  }

  #messages {
    flex: 1 1 0;
    min-height: 0;
    padding: 12px 8px;
    gap: 7px;
  }

  .msg {
    max-width: 86%;
    padding: 7px 8px 5px;
    font-size: 14px;
  }

  .message-content {
    display: block;
    width: 100%;
  }

  .message-footer {
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
    margin-top: 4px;
    align-self: flex-end;
  }

  .message-time {
    display: inline-block !important;
    visibility: visible !important;
    font-size: 10px;
  }

  .message-ticks {
    display: inline-block !important;
    visibility: visible !important;
    font-size: 11px;
  }

  .reply-quote {
    display: block !important;
    visibility: visible !important;
    padding: 6px 8px;
  }

  .reply-quote strong {
    font-size: 11px;
  }

  .reply-quote span {
    font-size: 12px;
  }

  .chat-photo {
    width: 210px;
    max-height: 260px;
  }

  #replyPreview {
    padding: 8px 11px;
  }

  #replyPreview p {
    font-size: 12px;
  }

  /* INPUT BAR */

  .input-area {
    position: relative;
    z-index: 10;
    display: flex;
    flex: 0 0 auto;
    width: 100%;
    gap: 6px;
    padding: 8px 9px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    background: #202c33;
  }

  #photoBtn {
    width: 39px;
    height: 43px;
    min-width: 39px;
    font-size: 22px;
  }

  #messageInput {
    height: 43px;
    padding: 0 14px;
    font-size: 16px;
  }

  #send {
    width: 43px;
    height: 43px;
    min-width: 43px;
    font-size: 19px;
  }

  #status {
    font-size: 11px;
  }

  .sidebar-header {
    min-height: 60px;
  }
}

/* SMALL PHONES */

@media (max-width: 380px) {
  .msg {
    max-width: 90%;
    font-size: 13px;
  }

  #messages {
    padding: 10px 7px;
  }

  .input-area {
    gap: 4px;
    padding-left: 6px;
    padding-right: 6px;
  }

  #photoBtn {
    width: 35px;
    min-width: 35px;
  }

  #send {
    width: 40px;
    height: 40px;
    min-width: 40px;
  }

  #messageInput {
    height: 41px;
    padding: 0 11px;
  }
}
  
</style>

</head>

<body>
<div class="chat-app">

  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="logo">Private Chat</div>
      <a class="back" href="notes.html">←</a>
    </div>

    <div class="search-box">
      <input id="search" placeholder="Search username">
      <button id="find" type="button">Search User</button>
    </div>

    <div class="recent-heading">Recent Chats</div>
    <div id="recentChats">
      <div id="recentEmpty">Loading recent chats...</div>
    </div>

    <div id="result"></div>

  </aside>

  <main class="chat-main">

    <div class="chat-header">
      <button id="mobileBack" type="button">←</button>

      <div class="avatar" id="chatAvatar">?</div>

      <div class="header-info">
        <h3 id="chatTitle">Select a user</h3>
        <p id="chatStatus">Private conversation</p>
        <p id="typingIndicator"></p>
      </div>
    </div>

    <div id="messages"></div>
     <div id="replyPreview" hidden>
  <div>
    <strong id="replyName">Replying</strong>
    <p id="replyText"></p>
  </div>
  <button id="cancelReply" type="button">✕</button>
</div>
    <div class="input-area">
      <input type="file" id="photoInput" accept="image/*" hidden>
      <button id="photoBtn" type="button">📷</button>
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button id="send" type="button">➤</button>
    </div>

    <p id="status"></p>

  </main>
</div>
<script>
/* MOBILE KEYBOARD VIEWPORT FIX */

if (window.visualViewport) {

    const updateChatHeight = () => {
        const height = window.visualViewport.height;

        document.documentElement.style.setProperty(
            "--chat-height",
            height + "px"
        );
    };

    window.visualViewport.addEventListener("resize", updateChatHeight);
    window.visualViewport.addEventListener("scroll", updateChatHeight);

    updateChatHeight();
}
</script>
<script type="module" src="chat.js"></script>
</body>
</html>
