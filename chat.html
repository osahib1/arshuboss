
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Chat</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0b141a url("image/chatsbackground.jpg") center center / cover no-repeat fixed;
  color: #e9edef;
  font-family: Arial, sans-serif;
}

.chat-app {
  height: 100vh;
  display: flex;
  overflow: hidden;
}

.sidebar {
  width: 350px;
  min-width: 280px;
  background: #111b21;
  border-right: 1px solid #26343b;
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  height: 65px;
  padding: 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #202c33;
}

.logo {
  font-size: 21px;
  font-weight: bold;
  color: #25d366;
}

.back {
  color: #e9edef;
  text-decoration: none;
  font-size: 26px;
}

.search-box { padding: 12px; }

.search-box input {
  width: 100%;
  padding: 13px;
  background: #202c33;
  color: white;
  border: none;
  outline: none;
  border-radius: 8px;
}

.search-box button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  background: #25d366;
  color: #111;
  border: none;
  border-radius: 7px;
  cursor: pointer;
}

.recent-heading {
  padding: 12px 15px 7px;
  color: #25d366;
  font-size: 14px;
  font-weight: bold;
}

#recentChats {
  overflow-y: auto;
  min-height: 0;
  border-bottom: 1px solid #26343b;
}

.recent-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 13px;
  border: 0;
  border-bottom: 1px solid #26343b;
  background: transparent;
  color: white;
  text-align: left;
  cursor: pointer;
}

.recent-item:hover { background: #202c33; }

.recent-avatar {
  width: 43px;
  height: 43px;
  min-width: 43px;
  border-radius: 50%;
  overflow: hidden;
  background: #374045;
  display: flex;
  align-items: center;
  justify-content: center;
}

.recent-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.recent-info {
  flex: 1;
  min-width: 0;
}

.recent-name {
  font-size: 14px;
  margin-bottom: 5px;
}

.recent-preview {
  font-size: 12px;
  color: #aebac1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.recent-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.recent-time {
  font-size: 10px;
  color: #8696a0;
}

.unread-badge {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 20px;
  background: #25d366;
  color: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: bold;
}

#recentEmpty {
  padding: 12px 15px;
  color: #8696a0;
  font-size: 12px;
}

#result {
  padding: 10px;
  overflow: auto;
}

#result button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px;
  margin-bottom: 8px;
  text-align: left;
  background: #202c33;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.search-avatar {
  width: 42px;
  height: 42px;
  min-width: 42px;
  border-radius: 50%;
  overflow: hidden;
  background: #374045;
  display: flex;
  align-items: center;
  justify-content: center;
}

.search-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.chat-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
 background: transparent;
}
.chat-header {
  min-height: 70px;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #202c33;
  border-bottom: 1px solid #26343b;
}

.avatar {
  width: 43px;
  height: 43px;
  min-width: 43px;
  border-radius: 50%;
  background: #374045;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.header-info { flex: 1; }

.header-info h3 {
  margin: 0;
  font-size: 16px;
  font-weight: 500;
}

.header-info p {
  margin: 5px 0 0;
  color: #8696a0;
  font-size: 12px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: transparent;
}

.msg-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}

.msg-row.mine { justify-content: flex-end; }
.msg-row.theirs { justify-content: flex-start; }

.msg-select {
  width: 18px;
  height: 18px;
  accent-color: #25d366;
}

.msg {
  max-width: 75%;
  width: fit-content;
  padding: 10px 13px;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.my-msg {
  background: #005c4b;
  color: white;
}

.other-msg {
  background: #202c33;
  color: white;
}

.chat-photo {
  width: 220px;
  max-width: 100%;
  border-radius: 10px;
  display: block;
  cursor: pointer;
}

.input-area {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: #202c33;
}

#photoBtn {
  width: 45px;
  height: 45px;
  border: none;
  background: transparent;
  color: white;
  font-size: 24px;
  cursor: pointer;
}

#messageInput {
  flex: 1;
  min-width: 0;
  height: 52px;
  padding: 0 18px;
  border: none;
  outline: none;
  border-radius: 30px;
  background: #2a3942;
  color: white;
  font-size: 16px;
}

#send {
  width: 52px;
  height: 52px;
  border: none;
  border-radius: 50%;
  background: #25d366;
  color: black;
  font-size: 22px;
  cursor: pointer;
}



#status {
  padding: 5px 12px;
  color: #ffb86b;
  font-size: 12px;
  background: #202c33;
  margin: 0;
}

#mobileBack { display: none; }

@media(max-width:650px) {
  .sidebar {
    width: 100%;
    min-width: 0;
  }

  .chat-main { display: none; }

  body.chat-open .sidebar { display: none; }

  body.chat-open .chat-main {
    display: flex;
    width: 100%;
  }

  body.chat-open #mobileBack { display: block; }

  #messages { padding: 12px; }
  .msg { max-width: 88%; }
}

  
/* MOBILE HEIGHT FIX */
html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
}

.chat-app {
  height: 100vh;
  height: 100dvh;
  min-height: 0;
}

.chat-main {
  min-height: 0;
}

#messages {
  min-height: 0;
}

@media (max-width: 650px) {
  html,
  body {
    height: 100%;
    overflow: hidden;
  }

  .chat-app {
    height: 100vh;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
  }

  body.chat-open .chat-main {
    height: 100%;
    min-height: 0;
    flex: 1;
  }

  .chat-header {
    flex-shrink: 0;
    min-height: 65px;
  }

  #messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }

  .input-area {
    flex-shrink: 0;
    padding: 8px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }

  #messageInput {
    height: 45px;
  }

  #send {
    width: 45px;
    height: 45px;
  }

  #photoBtn {
    width: 38px;
    height: 45px;
  }

  #status {
    flex-shrink: 0;
  }
}

</style>
</head>

<body>
<div class="chat-app">

  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="logo">Private Chat</div>
      <a class="back" href="notes.html">←</a>
    </div>

    <div class="search-box">
      <input id="search" placeholder="Search username">
      <button id="find" type="button">Search User</button>
    </div>

    <div class="recent-heading">Recent Chats</div>
    <div id="recentChats">
      <div id="recentEmpty">Loading recent chats...</div>
    </div>

    <div id="result"></div>

  </aside>

  <main class="chat-main">

    <div class="chat-header">
      <button id="mobileBack" type="button">←</button>

      <div class="avatar" id="chatAvatar">?</div>

      <div class="header-info">
        <h3 id="chatTitle">Select a user</h3>
        <p id="chatStatus">Private conversation</p>
      </div>
    </div>

    <div id="messages"></div>

    <div class="input-area">
      <input type="file" id="photoInput" accept="image/*" hidden>
      <button id="photoBtn" type="button">📷</button>
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button id="send" type="button">➤</button>
    </div>

    <p id="status"></p>

  </main>
</div>

<script type="module" src="chat.js"></script>
</body>
</html>
