
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile</title>
<style>
body{background:#000;color:white;font-family:Arial;padding:20px}
.card{max-width:450px;margin:30px auto;background:#171717;padding:25px;border-radius:18px}
input,button{width:100%;padding:13px;margin:10px 0;box-sizing:border-box;border-radius:8px}
input{background:#222;color:white;border:1px solid #555}
button{background:#673ab7;color:white;border:0;cursor:pointer}
img{width:100px;height:100px;border-radius:50%;object-fit:cover}
a{color:white}


.dp-buttons{
    display:flex;
    gap:12px;
    margin:15px 0 20px;
}

.dp-buttons button{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    background:#673ab7;
    color:white;
    font-size:15px;
    cursor:pointer;
}

.dp-buttons button:hover{
    background:#512da8;
}

#removeDP{
    background:#292929;
    border:1px solid #673ab7;
}


.dp-actions{
    display:flex;
    gap:10px;
    margin:15px 0;
    flex-wrap:wrap;
}

.dp-actions button{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    background:#673ab7;
    color:white;
    cursor:pointer;
}

#removeDP{
    background:#292929;
    border:1px solid #673ab7;
}

</style>
</head>
<body>
<div class="card">
<h2>My Profile</h2>

<img id="dp" src="https://placehold.co/100x100/222/fff?text=DP">

<div class="dp-actions">
    <button id="addDP" type="button">Add Your DP</button>

    <button id="changeDP" type="button">Change DP</button>

    <button id="removeDP" type="button">Remove DP</button>
</div>

<input id="photo" type="file" accept="image/*" hidden>

<p id="uid"></p>

<label>Username</label>
<input id="username" placeholder="Unique username">

<label>Display Name</label>
<input id="displayName" placeholder="Your name">




<input id="photo" type="file" accept="image/*" hidden>


<button id="save">Save Profile</button>
<p id="status"></p>



<script type="module" src="profile.js"></script>
</body>
</html>
