<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password Manager</title>

    <link rel="stylesheet" href="passwords.css">

</head>

<body>

    <h1>🔐 Password Manager</h1>


    <!-- ADD PASSWORD -->

    <div class="password-box">

        <label>Website</label>

        <input
            type="text"
            id="website"
            placeholder="Example: Instagram"
        >


        <label>Email / Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter email or username"
        >


        <label>Password</label>

        <div class="password-input">

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

            <button
                type="button"
                id="showPassword"
            >
                👁
            </button>

        </div>


        <label>Note</label>

        <textarea
            id="note"
            placeholder="Write your note..."
        ></textarea>


        <button
            type="button"
            id="saveBtn"
        >
            💾 Save Password
        </button>

    </div>


    <!-- SAVED PASSWORDS -->

    <h2>Saved Passwords</h2>

    <div id="passwordList"></div>


    <!-- <script src="passwords.js"></script> -->

    
    <script
    type="module"
    src="passwords.js">
</script>

</body>

</html>
