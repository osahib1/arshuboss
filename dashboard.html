
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


/* =========================
   BODY
========================= */

body {
    min-height: 100vh;
    width: 100%;

    background-color: black;
    background-image: url("image/bts.jpeg");

    background-repeat: no-repeat;
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;

    color: white;
}


/* =========================
   FOLDER CARDS
========================= */

.folder-card {
    display: inline-block;

    width: 218px;
    padding: 19px;
    margin: 16px;

    background: #1e2343;
    border-radius: 32px;

    text-align: center;
    font-size: 24px;
    color: white;

    transition: 0.2s;
}

.folder-card:hover {
    transform: scale(1.03);
    background-color: rgb(79, 76, 69);
}


/* FOLDER LINKS */

a {
    text-decoration: none;
    color: white;
}

.folder {
    display: block;
    width: 100%;
}


/* =========================
   LOGOUT
========================= */

#logout {
    position: fixed;

    left: 30px;
    bottom: 30px;

    background: red;
    color: white;

    border: none;
    padding: 11px 17px;

    border-radius: 8px;
    cursor: pointer;

    z-index: 9999;
}

#logout:hover {
    background: darkred;
}


/* =========================
   PROFILE DP
========================= */

.profile-icon {
    position: fixed;

    top: 18px;
    right: 20px;

    width: 42px;
    height: 42px;

    border-radius: 50%;
    overflow: hidden;

    border: 2px solid #673ab7;

    z-index: 9999;
}

.profile-icon img {
    width: 100%;
    height: 100%;

    object-fit: cover;
    display: block;
}


/* =========================
   WELCOME SCREEN
========================= */

#welcomeScreen {
    display: none;

    position: fixed;
    inset: 0;

    width: 100%;
    height: 100vh;
    height: 100dvh;

    margin: 0;
    padding: 0;

    background: #000;

    align-items: center;
    justify-content: center;

    z-index: 999999;

    overflow: hidden;
}


/* WELCOME CONTENT */

#welcomeContent {
    position: relative;
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0 12px;

    background: transparent;
    text-align: center;
    color: white;
}

/* Welcome zoom animation */
#welcomeScreen.show #welcomeContent {
    animation: welcomeZoom 0.8s ease both;
}

#welcomeScreen.show #welcomeLock {
    animation: lockPop 0.8s ease both;
}

#welcomeScreen.show #welcomeTitle {
    animation: textUp 0.8s ease both;
}

#welcomeScreen.show #welcomeName {
    animation: textUp 1s ease both;
}

@keyframes welcomeZoom {
    0% {
        transform: scale(0.4);
        opacity: 0;
    }
    60% {
        transform: scale(1.15);
        opacity: 1;
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes lockPop {
    0% {
        transform: scale(0.3) rotate(-20deg);
        opacity: 0;
    }
    60% {
        transform: scale(1.2) rotate(5deg);
        opacity: 1;
    }
    100% {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}

@keyframes textUp {
    from {
        transform: translateY(25px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

/* LOCK ICON */

#welcomeLock {
    display: block;

    width: 100%;

    background: transparent;

    font-size: 90px;

    margin: 0 0 20px;
    padding: 0;

    border: none;
    border-radius: 0;

    animation: lockPop 0.8s ease both;
}


/* WELCOME TITLE */

#welcomeTitle {
    display: block;

    width: 100%;

    background: transparent;

    color: white;

    font-size: 52px;
    font-weight: bold;

    margin: 0;
    padding: 0;

    border: none;

    animation: textUp 0.8s ease both;
}


/* WELCOME NAME */

#welcomeName {
    display: block;

    width: 100%;

    background: transparent;

    color: white;

    font-size: 46px;
    font-weight: bold;

    margin: 8px 0 0;
    padding: 0;

    border: none;

    animation: textUp 1s ease both;
}


/* =========================
   ANIMATIONS
========================= */

/* Welcome zoom */

@keyframes welcomeZoom {

    0% {
        transform: scale(0.5);
        opacity: 0;
    }

    60% {
        transform: scale(1.12);
        opacity: 1;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}


/* Lock animation */

@keyframes lockPop {

    0% {
        transform: scale(0.3) rotate(-20deg);
        opacity: 0;
    }

    60% {
        transform: scale(1.2) rotate(5deg);
        opacity: 1;
    }

    100% {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}


/* Text animation */

@keyframes textUp {

    from {
        transform: translateY(25px);
        opacity: 0;
    }

    to {
        transform: translateY(0);
        opacity: 1;
    }
}


/* Welcome fade out */

@keyframes welcomeFadeOut {

    0% {
        opacity: 1;
        visibility: visible;
    }

    75% {
        opacity: 1;
        visibility: visible;
    }

    100% {
        opacity: 0;
        visibility: hidden;
    }
}


/* =========================
   MOBILE RESPONSIVE
========================= */

@media (max-width: 600px) {

    body {
        min-height: 100vh;
        min-height: 100dvh;

        padding: 20px 15px 100px;

        width: 100%;

        overflow-x: hidden;

        text-align: center;

        background-size: cover;
        background-position: center center;
    }


    /* FOLDERS */

    .folder-card {
        display: block;

        width: 90%;
        max-width: 400px;

        margin: 20px auto;
        padding: 0;

        background: transparent;
        border-radius: 0;
    }

    .folder-card:hover {
        background: transparent;
        transform: none;
    }

    .folder-card .folder {
        display: block;

        width: 100%;

        padding: 20px 15px;

        background: #222;

        border-radius: 50px;

        text-align: center;
        font-size: 24px;

        color: white;
    }


    /* PROFILE */

    .profile-icon {
        top: 15px;
        right: 15px;

        width: 42px;
        height: 42px;
    }


    /* LOGOUT */

    #logout {
        position: fixed;

        left: 15px;
        bottom: 15px;

        right: auto;
        top: auto;

        margin: 0;

        padding: 12px 20px;

        z-index: 99999;
    }


    /* WELCOME */

    #welcomeScreen {
        width: 100%;
        height: 100vh;
        height: 100dvh;

        display: none;

        align-items: center;
        justify-content: center;

        padding: 0;
    }


    #welcomeContent {
        width: 100%;
        max-width: 100%;

        padding: 0 10px;

        text-align: center;
    }


    #welcomeLock {
        font-size: 70px;

        margin-bottom: 15px;
    }


    #welcomeTitle {
        font-size: clamp(28px, 9vw, 38px);
        text-align: center;
    }


    #welcomeName {
        font-size: clamp(25px, 8vw, 34px);
        text-align: center;
    }

}

</style>
</head>


<body>


<!-- =========================
     PROFILE
========================= -->

<a href="profile.html" class="profile-icon">

    <img
        id="dashboardDP"
        src="https://placehold.co/80x80/222/fff?text=DP"
        alt="Profile"
    >

</a>


<!-- =========================

========================= -->

<div class="folder-card">
    <a class="folder" href="notes.html">📁Notes</a>
</div>

<div class="folder-card">
    <a class="folder" href="password.html">📁Passwords</a>
</div>

<div class="folder-card">
    <a class="folder" href="Photo.html">📁Photos</a>
</div>

<div class="folder-card">
    <a class="folder" href="phone.html">📁Phone</a>
</div>


<!-- =========================
     WELCOME SCREEN
========================= -->

<div id="welcomeScreen">

    <div id="welcomeContent">

        <div id="welcomeLock">👿</div>

        <div id="welcomeTitle">Welcome Jamal</div>

        <div id="welcomeName"></div>

    </div>

</div>


<!-- =========================
     WELCOME SCRIPT
========================= -->

<script>

const welcomeScreen = document.getElementById("welcomeScreen");

if (sessionStorage.getItem("justLoggedIn") === "yes") {

    welcomeScreen.style.display = "flex";

    welcomeScreen.style.animation =
        "welcomeFadeOut 3s ease forwards";

    sessionStorage.removeItem("justLoggedIn");

    setTimeout(function () {

        welcomeScreen.style.display = "none";

        welcomeScreen.style.animation = "none";

    }, 3000);

}

</script>


<!-- =========================
     LOGOUT
========================= -->

<button id="logout">🚪 Logout</button>


<!-- =========================
     FIREBASE SCRIPTS
========================= -->

<script type="module" src="dashboard.js"></script>

<script type="module" src="auth-guard.js"></script>


</body>
</html>
