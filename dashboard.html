   <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

<title>Dashboard</title>
<!-- <link rel="stylesheet" href="note.html"> -->
<style>
/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


/* =========================
   BODY / BACKGROUND
========================= */

body {
    margin: 0;
    min-height: 100vh;
    width: 100%;

    background-color: black;
    background-image: url("image/bts.jpeg");

    background-repeat: no-repeat;
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;

    color: white;


}


/* =========================
   HEADING
========================= */

h1 {
    text-align: center;
    margin-top: 10px;
    font-size: 28px;
}


/* =========================
   FOLDERS
========================= */

div {
  display: inline-block;
    width: 218px;
    padding: 19px;
    margin: 16px;
    background: #1e2343;
    border-radius: 32px;
    text-align: center;
    font-size: 24px;
    color: white;
}


/* =========================
   FOLDER LINK
========================= */

a {
    text-decoration: none;
    color: white;
}


/* =========================
   HOVER
========================= */

div:hover {
    transform: scale(1.03);

    color: black;

    background-color: rgb(79, 76, 69);
}


/* =========================
   LOGOUT
========================= */

#logout {
    position: fixed;

    left: 30px;
    bottom: 30px;

    background: red;

    color: white;

    border: none;

    padding: 11px 17px;

    border-radius: 8px;

    cursor: pointer;
}


#logout:hover {
    background: darkred;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {
        min-height: 100vh;

        padding: 15px 10px 90px 10px;

        background-size: cover;
        background-position: center center;

        text-align: center;
    }


    h1 {
        font-size: 24px;

        margin: 10px 0 25px 0;
    }


    div {
        display: block;

        width: 85%;

        max-width: 350px;

        margin: 18px auto;

        padding: 18px 15px;

        font-size: 22px;

        border-radius: 50px;
    }


    div a {
        display: block;

        width: 100%;
    }


    #logout {
        position: fixed;

        left: 15px;
        bottom: 15px;

        right: auto;
        top: auto;

        padding: 12px 20px;

        z-index: 9999;
    }
}
@media screen and (max-width: 600px) {

    body {
        margin: 0 !important;
        padding: 20px 15px 100px !important;
        width: 100% !important;
        box-sizing: border-box !important;
        overflow-x: hidden !important;
        text-align: center !important;
    }

    h1 {
        font-size: 24px !important;
        margin: 10px 0 30px !important;
        text-align: center !important;
    }

    /* HAR FOLDER KO EK ALAG LINE */
    body > div {
        display: block !important;

        width: 90% !important;
        max-width: 400px !important;

        margin: 20px auto !important;
        padding: 0 !important;

        box-sizing: border-box !important;

        background: transparent !important;
    }

    /* FOLDER BUTTON */
    body > div > a.folder {
        display: block !important;

        width: 100% !important;

        box-sizing: border-box !important;

        padding: 20px 15px !important;

        margin: 0 !important;

        background: #222 !important;

        border-radius: 50px !important;

        text-align: center !important;

        font-size: 24px !important;

        color: white !important;

        text-decoration: none !important;
    }

    /* LOGOUT */
    #logout {
        position: fixed !important;

        left: 15px !important;
        bottom: 15px !important;

        right: auto !important;
        top: auto !important;

        margin: 0 !important;

        z-index: 99999 !important;
    }
}


#welcomeScreen {
    position: fixed !important;

    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    margin: 0 !important;
    padding: 0 !important;

    background: #000 !important;

    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    z-index: 999999 !important;

    border: none !important;
    border-radius: 0 !important;

    animation: welcomeFadeOut 3s ease forwards;
}


/* Main content */

#welcomeContent {
    width: auto !important;
    height: auto !important;

    margin: 0 !important;
    padding: 0 !important;

    background: transparent !important;

    border: none !important;
    border-radius: 0 !important;

    box-shadow: none !important;

    text-align: center !important;

    color: white !important;

    animation: welcomeZoom 0.8s ease;
}


/* Lock */

#welcomeLock {
    background: transparent !important;

    font-size: 90px;

    margin: 0 0 20px 0 !important;
    padding: 0 !important;

    border: none !important;
    border-radius: 0 !important;

    animation: lockPop 0.8s ease;
}


/* Welcome */

#welcomeTitle {
    background: transparent !important;

    color: white !important;

    font-size: 52px !important;
    font-weight: bold !important;

    margin: 0 !important;
    padding: 0 !important;

    border: none !important;

    animation: textUp 0.8s ease;
}


/* Arshus Fan */

#welcomeName {
    background: transparent !important;

    color: white !important;

    font-size: 46px !important;
    font-weight: bold !important;

    margin: 8px 0 0 0 !important;
    padding: 0 !important;

    border: none !important;

    animation: textUp 1s ease;
}


/* ==============================
   ANIMATIONS
================================ */

@keyframes welcomeZoom {

    from {
        transform: scale(0.6);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }

}


@keyframes lockPop {

    0% {
        transform: scale(0.3) rotate(-20deg);
        opacity: 0;
    }

    60% {
        transform: scale(1.2) rotate(5deg);
        opacity: 1;
    }

    100% {
        transform: scale(1) rotate(0);
        opacity: 1;
    }

}


@keyframes textUp {

    from {
        transform: translateY(25px);
        opacity: 0;
    }

    to {
        transform: translateY(0);
        opacity: 1;
    }

}


@keyframes welcomeFadeOut {

    0% {
        opacity: 1;
        visibility: visible;
    }

    75% {
        opacity: 1;
        visibility: visible;
    }

    100% {
        opacity: 0;
        visibility: hidden;
    }

}


/* ==============================
   PHONE
================================ */

@media (max-width: 600px) {

    #welcomeLock {
        font-size: 70px;
    }

    #welcomeTitle {
        font-size: 38px !important;
    }

    #welcomeName {
        font-size: 34px !important;
    }

}

#welcomeScreen {
    display: none;

    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background: black;

    align-items: center;
    justify-content: center;

    z-index: 999999;
}



.profile-icon{
  position:fixed;
  top:18px;
  right:20px;
  width:42px;
  height:42px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid #673ab7;
  z-index:9999;
}

.profile-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

    
</style>


</head>
