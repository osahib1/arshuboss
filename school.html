body{
    background-color:black;
    margin:11px;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
}

.gallery img{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
}

.popup{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
}

.popup img{
    max-width:90%;
    max-height:80%;
    border-radius:10px;
}

#close{
    position:absolute;
    top:20px;
    right:30px;
    color:white;
    font-size:40px;
    cursor:pointer;
}

.popup-buttons{
    margin-top:20px;
    display:flex;
    gap:15px;
}

#downloadBtn,
#deleteBtn{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
}

#downloadBtn{
    background:#007bff;
}

#downloadBtn:hover{
    background:#0056b3;
}

#deleteBtn{
    background:#e53935;
}

#deleteBtn:hover{
    background:#b71c1c;
}
